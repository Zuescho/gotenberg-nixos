name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: format, flake check, NixOS build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Lint formatting
        run: nix fmt -- --ci

      - name: Flake check
        run: nix flake check --show-trace

      - name: Build the NixOS configuration
        run: nix build .#nixosConfigurations.gotenberg.config.system.build.toplevel --print-out-paths --show-trace
