name: Change
description: A change to the module, the Hyper-V host, or the docs
title: "change: "
body:
  - type: textarea
    id: need
    attributes:
      label: What should change
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This stays LAN-only. The API is not opened to every source.
        - label: Placeholders in hosts/gotenberg/site.nix stay placeholders.
        - label: No LICENSE file until the maintainer chooses one.
